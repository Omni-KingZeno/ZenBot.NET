name: Windows

on:
  push:
    branches: [ "ZenBot" ]
  pull_request:
    branches: [ "ZenBot" ]

permissions:
  contents: write

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: SysBot.NET.slnX

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore NuGet packages
      run: dotnet restore

    - name: Execute unit tests
      run: dotnet run --project SysBot.Tests/SysBot.Tests.csproj --configuration Release

    - name: Get version from source
      id: version
      run: |
        $content = Get-Content "SysBot.Pokemon\Structures\ProgramConfig.cs" -Raw
        if ($content -match 'new Version\((\d+),\s*(\d+),\s*(\d+)\)') {
          $version = "$($matches[1]).$($matches[2]).$($matches[3])"
          echo "number=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "Could not find version string in ProgramConfig.cs"
          exit 1
        }
      shell: pwsh

    - name: Build application
      run: >
        dotnet publish SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj
        --configuration Release
        --runtime win-x64
        --self-contained false
        /p:PublishSingleFile=true
        /p:IncludeAllContentForSelfExtract=true
        /p:PublishTrimmed=false
        /p:DebugType=portable
        /p:OutputPath=bin\Release\net10.0-windows\
        /p:Version=${{ steps.version.outputs.number }}
        /p:AssemblyVersion=${{ steps.version.outputs.number }}
        /p:FileVersion=${{ steps.version.outputs.number }}

    - name: Upload Application
      uses: actions/upload-artifact@v7
      with:
        name: SysBot.Pokemon.WinForms
        path: SysBot.Pokemon.WinForms\bin\Release\net10.0-windows\publish\*.exe

    - name: Create or update release
      if: github.event_name == 'push' && github.ref == 'refs/heads/ZenBot'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "${{ steps.version.outputs.tag }}"
        $files = Get-ChildItem "SysBot.Pokemon.WinForms/bin/Release/net10.0-windows/publish/*.exe" | ForEach-Object { $_.FullName }

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $tag exists - replacing exe."
          gh release upload $tag $files --clobber
        } else {
          Write-Host "No release for $tag - creating it."
          gh release create $tag $files --title "Release $tag" --generate-notes --target ${{ github.sha }}
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }