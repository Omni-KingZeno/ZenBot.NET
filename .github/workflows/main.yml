name: Windows

on:
  push:
    branches: [ "ZenBot" ]
  pull_request:
    branches: [ "ZenBot" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: SysBot.NET.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore NuGet packages
      run: dotnet restore

    - name: Execute unit tests
      run: dotnet test

    - name: Get version from source
      id: version
      run: |
        $content = Get-Content "SysBot.Pokemon\Structures\ProgramConfig.cs" -Raw
        if ($content -match 'new Version\((\d+),\s*(\d+),\s*(\d+)\)') {
          $version = "$($matches[1]).$($matches[2]).$($matches[3])"
          echo "number=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT
        } else {
          Write-Error "Could not find version string in ProgramConfig.cs"
          exit 1
        }
      shell: pwsh

    - name: Build application
      run: >
        dotnet publish SysBot.Pokemon.WinForms/SysBot.Pokemon.WinForms.csproj
        --configuration Release
        --runtime win-x64
        --self-contained false
        /p:PublishSingleFile=true
        /p:IncludeAllContentForSelfExtract=true
        /p:PublishTrimmed=false
        /p:DebugType=portable
        /p:OutputPath=bin\Release\net10.0-windows\
        /p:Version=${{ steps.version.outputs.number }}
        /p:AssemblyVersion=${{ steps.version.outputs.number }}
        /p:FileVersion=${{ steps.version.outputs.number }}

    - name: Upload Application
      uses: actions/upload-artifact@v4
      with:
        name: SysBot.Pokemon.WinForms
        path: SysBot.Pokemon.WinForms\bin\Release\net10.0-windows\publish\*.exe

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/ZenBot'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        draft: false
        prerelease: false
        files: SysBot.Pokemon.WinForms/bin/Release/net10.0-windows/publish/*.exe
        generate_release_notes: true
